<!DOCTYPE html>
<html lang="en">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
       <link rel="stylesheet" href="style.css">
    <title>Minesweeper</title>
</head>
<body>
    <h1>Minesweeper</h1>

    <div id="levels">
        <button data-level="beginner">Beginner 9x9</button>
        <button data-level="intermediate">Intermediate 16x16</button>
        <button data-level="expert">Expert 30x16</button>
    </div>

    <div id="hud">
        <div class="stat"><span>Mines left</span><strong id="mines-left">10</strong></div>
        <div class="stat"><span>Time</span><strong id="time">000</strong></div>
        <div class="stat"><span>Best</span><strong id="best">--</strong></div>
    </div>

    <div id="board-wrap">
        <div id="board"></div>
    </div>

    
    <script src="script.js"></script>
</body>
</html>
